    <script>
      // Ignore background HMR and transient WebSocket connection errors as per environment instructions
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (String(e.reason).includes('WebSocket') || String(e.reason.message).includes('WebSocket') || String(e.reason).includes('vite'))) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        if (e && (String(e.message).includes('WebSocket') || String(e.filename).includes('@vite/client'))) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 m-0 p-0 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
